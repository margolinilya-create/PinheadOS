# Ночная выгрузка Storage.
#
# Зачем. Бэкапы Supabase и PITR покрывают Postgres, но НЕ объекты Storage:
# версионирования у бакетов нет, а код удаляет через remove() — это hard delete.
# Значит одна ошибка при замене файла ТЗ ломает техзадание у всех цехов группы,
# и восстановить его неоткуда. При этом объём смешной: на 29.07.2026 в обоих
# бакетах 5 объектов на 134 КБ.
#
# Что делает. Скачивает содержимое `erp-attachments` и `sku-photos` через
# Storage API и кладёт архивом в артефакты запуска (retention 30 дней).
# Это не «настоящий» бэкап в чужое хранилище, но он превращает потерю файла
# из безвозвратной в «достать из вчерашнего артефакта».
#
# ТРЕБУЕТ СЕКРЕТОВ (добавить в Settings → Secrets and variables → Actions):
#   SUPABASE_URL          — https://glhwbktsokphgksdvcxj.supabase.co
#   SUPABASE_SERVICE_KEY  — service_role ключ (Dashboard → Settings → API)
# Без них job падает с понятным сообщением, а не молча выгружает пустоту.

name: Storage backup

on:
  schedule:
    # 02:30 UTC ежедневно — ночь по Москве, цеха не работают
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Проверить секреты
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Не заданы SUPABASE_URL и/или SUPABASE_SERVICE_KEY — выгрузка невозможна."
            exit 1
          fi

      - name: Выгрузить бакеты
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          npm install --no-save @supabase/supabase-js@2
          node --input-type=module <<'JS'
          import { createClient } from '@supabase/supabase-js';
          import { mkdir, writeFile } from 'node:fs/promises';
          import { dirname, join } from 'node:path';

          const sb = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_KEY);
          const BUCKETS = ['erp-attachments', 'sku-photos'];
          let total = 0;

          /** Рекурсивный обход: Storage отдаёт «папки» как записи без id */
          async function walk(bucket, prefix = '') {
            const { data, error } = await sb.storage.from(bucket).list(prefix, { limit: 1000 });
            if (error) throw new Error(`${bucket}/${prefix}: ${error.message}`);
            for (const entry of data) {
              const path = prefix ? `${prefix}/${entry.name}` : entry.name;
              if (entry.id === null) { await walk(bucket, path); continue; }
              const { data: blob, error: dlErr } = await sb.storage.from(bucket).download(path);
              if (dlErr) throw new Error(`скачивание ${bucket}/${path}: ${dlErr.message}`);
              const out = join('backup', bucket, path);
              await mkdir(dirname(out), { recursive: true });
              await writeFile(out, Buffer.from(await blob.arrayBuffer()));
              total += 1;
              console.log(`${bucket}/${path}`);
            }
          }

          for (const b of BUCKETS) await walk(b);
          // Пустая выгрузка — это либо сбой прав, либо реально пустые бакеты.
          // Молча класть пустой артефакт нельзя: он выглядит как успешный бэкап.
          if (total === 0) {
            console.error('::error::Не выгружено ни одного файла — проверьте права service_role.');
            process.exit(1);
          }
          console.log(`Всего файлов: ${total}`);
          JS

      - uses: actions/upload-artifact@v4
        with:
          name: storage-backup-${{ github.run_id }}
          path: backup/
          retention-days: 30
